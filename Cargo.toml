[package]
name = "apex-legends-voice-switcher"
version = "1.0.0"
edition = "2024"
license = "MIT"
build = "build.rs"

[[bin]]
name = "ApexLegendsVoiceSwitcher"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "accessibility", "compat-1-2"] }
ureq = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"
codegen-units = 1
panic = "abort"
